name: Android Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore for CI build
        run: |
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build APK
        run: gradle assembleDebug

      - name: Prepare APK output
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/CryptoIntelligenceExchangeAI-debug.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoIntelligenceExchangeAI-apk
          path: release-output/CryptoIntelligenceExchangeAI-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Crypto Intelligence Exchange AI v1.0.${{ github.run_number }}
          body: |
            Automated Android APK build from commit `${{ github.sha }}` on `main`.
          files: release-output/CryptoIntelligenceExchangeAI-debug.apk
          draft: false
          prerelease: false
